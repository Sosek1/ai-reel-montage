[project]
name = "ai-reel-montage"
version = "0.1.0"
description = "Montage engine: match recording + ball tracking + named windows -> one vertical 9:16 reel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "ijson>=3.3",
]

[project.scripts]
ai-reel-montage = "ai_reel_montage.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs ffmpeg and/or real source materials (deselect with -m 'not integration')",
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "ijson.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4"]
ignore = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
